<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #43cea2, #185a9d);
            color: #fff;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
            background-color: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-custom {
            background-color: #fff;
            color: #185a9d;
            font-weight: bold;
            border-radius: 30px;
            width: 100%;
            padding: 10px;
        }
        .btn-custom:hover {
            background-color: #185a9d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌾 AI-Driven Crop Yield Prediction</h2>
        <form action="/predict" method="post">

            <div class="mb-3">
                <label>State:</label>
                <input type="text" name="state" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Crop Year:</label>
                <input type="number" name="crop_year" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Season:</label>
                <input type="text" name="season" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Crop Name:</label>
                <input type="text" name="crop" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Fertilizer Used (kg/hectare):</label>
                <input type="number" step="0.01" name="fertilizer" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Pesticide Used (kg/hectare):</label>
                <input type="number" step="0.01" name="pesticide" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Annual Rainfall (mm):</label>
                <input type="number" step="0.01" name="rainfall" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-custom">Predict Yield 🚀</button>
        </form>
    </div>
</body>
</html>
